# Whole app: Qdrant + FastAPI backend + Next.js frontend.
#   cd infra && docker compose up -d --build
#   open http://localhost:3000
# Needs backend/.env with OPENAI_API_KEY (and optional Langfuse keys).
# Langfuse self-hosted is a separate stack: infra/langfuse/.
# Ports are bound to 127.0.0.1: /ask spends the OpenAI key, so the stack is
# not reachable from the local network.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333" # REST
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      # Reuse locally computed corpus embeddings: indexing a fresh Qdrant is then free.
      - ../backend/data/cache:/app/data/cache
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_storage:
